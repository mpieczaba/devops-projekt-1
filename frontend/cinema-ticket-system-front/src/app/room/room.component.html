<div class="hall">
  @for (row of selectedRoom; track row[0]) {
    <div class="row">
        Row {{ row[0] }}
      @for (seat of row[1]; track seat.seatId) {
        <app-seat [seat]="seat" [selected]="chosenSeats.includes(seat.seatId)" (chosenSeat)="onChosenSeat($event)"></app-seat>
      }
    </div>
  }
</div>
