---
- name: Configure common settings
  hosts: all
  become: true
  roles:
    - common
    - security

- name: Configure database server
  hosts: db_servers
  become: true
  roles:
    - database

- name: Configure backend server
  hosts: backend_servers
  become: true
  roles:
    - backend

- name: Configure frontend server
  hosts: frontend_servers
  become: true
  roles:
    - frontend
