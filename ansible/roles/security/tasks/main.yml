---
# healthcheck of UFW existence, OpenSSH, default blockage of incoming traffic and defalt allowance of outgoing traffic, firewall on

- name: Ensure UFW is installed
  ansible.builtin.apt:
    name: ufw
    state: present

- name: Allow SSH access
  community.general.ufw:
    rule: allow
    name: OpenSSH

- name: Deny incoming traffic by default
  community.general.ufw:
    direction: incoming
    policy: deny

- name: Allow outgoing traffic by default
  community.general.ufw:
    direction: outgoing
    policy: allow

- name: Enable UFW
  community.general.ufw:
    state: enabled

- name: Disable root SSH login (drop-in, read before sshd_config)
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/10-cinema-hardening.conf
    content: |      PermitRootLogin no
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart SSH

- name: Disable root SSH login (main sshd_config)
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PermitRootLogin'
    line: 'PermitRootLogin no'
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart SSH
