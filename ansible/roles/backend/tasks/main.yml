---
- name: Install Java
  ansible.builtin.apt:
    name:
      - openjdk-21-jre-headless
    state: current
    update_cache: true

- name: Create backend system user
  ansible.builtin.user:
    name: "{{ backend_app_user }}"
    system: true
    shell: /usr/sbin/nologin
    home: "{{ backend_app_dir }}"
    create_home: false

- name: Create backend application directory
  ansible.builtin.file:
    path: "{{ backend_app_dir }}"
    state: directory
    owner: "{{ backend_app_user }}"
    group: "{{ backend_app_user }}"
    mode: "0755"

- name: Copy backend JAR
  ansible.builtin.copy:
    src: "{{ backend_jar_source }}"
    dest: "{{ backend_jar_path }}"
    owner: "{{ backend_app_user }}"
    group: "{{ backend_app_user }}"
    mode: "0644"
  notify: Restart backend

- name: Create backend configuration directory
  ansible.builtin.file:
    path: "{{ backend_env_path | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create backend environment file
  ansible.builtin.template:
    src: backend.env.j2
    dest: "{{ backend_env_path }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: Restart backend

- name: Allow backend traffic from frontend
  community.general.ufw:
    rule: allow
    direction: in
    from_ip: "{{ backend_frontend_ip }}"
    to_port: "{{ backend_port }}"
    proto: tcp

- name: Install backend systemd service
  ansible.builtin.template:
    src: cinema-backend.service.j2
    dest: "/etc/systemd/system/{{ backend_service_name }}.service"
    owner: root
    group: root
    mode: "0644"
  notify: Restart backend

- name: Ensure backend service is enabled and running
  ansible.builtin.systemd:
    name: "{{ backend_service_name }}"
    enabled: true
    state: started
    daemon_reload: true

- name: Wait for backend health endpoint
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ backend_port }}/movies"
    status_code: 200
  register: backend_health
  retries: 30
  delay: 2
  until: backend_health.status == 200
