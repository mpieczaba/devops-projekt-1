---
# Inventory for manual Ansible start via the private network host, fe.:
#   cd ansible && ansible-playbook site.yml --ask-vault-pass
#   cd ansible && ansible-playbook tests/verify.yml
# `vagrant up` / `vagrant provision` generates its own inventory with same host names and group (as seen in ansible.groups in Vagrantfile)
all:
  vars:
    ansible_user: vagrant

  children:
    db_servers:
      hosts:
        db:
          ansible_host: 192.168.56.10
          ansible_ssh_private_key_file: "{{ inventory_dir }}/../../.vagrant/machines/db/virtualbox/private_key"

    backend_servers:
      hosts:
        backend:
          ansible_host: 192.168.56.11
          ansible_ssh_private_key_file: "{{ inventory_dir }}/../../.vagrant/machines/backend/virtualbox/private_key"

    frontend_servers:
      hosts:
        frontend:
          ansible_host: 192.168.56.12
          ansible_ssh_private_key_file: "{{ inventory_dir }}/../../.vagrant/machines/frontend/virtualbox/private_key"
