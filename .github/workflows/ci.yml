name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run backend tests
        run: ./mvnw test

  frontend-unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/cinema-ticket-system-front
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/cinema-ticket-system-front/package-lock.json
      - run: npm ci
      - run: npm test

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend-unit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/cinema-ticket-system-front/package-lock.json
      - name: Start stack
        run: docker compose up -d --build --wait
      - name: Install frontend dependencies
        working-directory: frontend/cinema-ticket-system-front
        run: npm ci
      - name: Install Playwright browsers
        working-directory: frontend/cinema-ticket-system-front
        run: npx playwright install --with-deps chromium
      - name: Run E2E tests
        working-directory: frontend/cinema-ticket-system-front
        env:
          E2E_SKIP_WEB_SERVER: '1'
        run: |
          npm run start -- --port 4200 &
          for i in {1..60}; do
            curl -sf http://localhost:4200 >/dev/null && break
            sleep 2
          done
          npm run e2e
      - name: Stop stack
        if: always()
        run: docker compose down -v
